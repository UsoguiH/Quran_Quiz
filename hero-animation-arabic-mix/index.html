<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نوفا فايس × الأرشيف — أنيميشن مدمج</title>
    <link rel="stylesheet" href="./vendor/fonts.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- ================= FINAL BASE: Archive hero (revealed last) ================= -->
    <section class="hero">
      <div class="header">
        <h1>الأرشيف</h1>
      </div>
      <div class="hero-footer">
        <p>الدوام</p>
        <p>الإتقان</p>
        <p>التعبير</p>
      </div>
    </section>

    <!-- ================= PHASE A: Nova Vice intro ================= -->
    <div class="overlay">
      <div class="projects">
        <div class="projects-header">
          <p>المشروع</p>
          <p>المخرج</p>
        </div>
      </div>
      <div class="loader">
        <h1 class="logo-line-1">نوفا</h1>
        <h1 class="logo-line-2">فايس</h1>
      </div>
      <div class="locations">
        <div class="locations-header">
          <p>الموقع</p>
        </div>
      </div>
    </div>

    <div class="image-grid">
      <div class="grid-row">
        <div class="img"><img src="./public/nova/img1.jpeg" alt="" /></div>
        <div class="img"><img src="./public/nova/img2.jpeg" alt="" /></div>
        <div class="img"><img src="./public/nova/img3.jpeg" alt="" /></div>
      </div>
      <div class="grid-row">
        <div class="img"><img src="./public/nova/img4.jpeg" alt="" /></div>
        <div class="img hero-img"><img src="./public/nova/img5.jpeg" alt="" /></div>
        <div class="img"><img src="./public/nova/img6.jpeg" alt="" /></div>
      </div>
      <div class="grid-row">
        <div class="img"><img src="./public/nova/img7.jpeg" alt="" /></div>
        <div class="img"><img src="./public/nova/img8.jpeg" alt="" /></div>
        <div class="img"><img src="./public/nova/img9.jpeg" alt="" /></div>
      </div>
    </div>

    <!-- ================= PHASE B: Archive preloader (hidden until handoff) ============ -->
    <div class="preloader">
      <div class="preloader-images">
        <div class="preloader-img"><img src="./public/archive/img1.jpg" alt="" /></div>
        <div class="preloader-img"><img src="./public/archive/img2.jpg" alt="" /></div>
        <div class="preloader-img"><img src="./public/archive/img3.jpg" alt="" /></div>
        <div class="preloader-img"><img src="./public/archive/img4.jpg" alt="" /></div>
        <div class="preloader-img"><img src="./public/archive/img5.jpg" alt="" /></div>
        <div class="preloader-img"><img src="./public/archive/img6.jpg" alt="" /></div>
      </div>
      <div class="preloader-header">
        <h1>أرشيف</h1>
        <div class="preloader-counter">
          <p>000</p>
        </div>
      </div>
    </div>

    <nav>
      <div class="nav-logo">
        <a href="#">أرشيف</a>
      </div>
      <div class="nav-links">
        <a href="#">الفهرس</a>
        <a href="#">المجموعة</a>
        <a href="#">المادة</a>
        <a href="#">العملية</a>
        <a href="#">معلومات</a>
      </div>
    </nav>

    <!-- Self-hosted libraries (no CDN) -->
    <script src="./vendor/gsap.min.js"></script>
    <script src="./vendor/CustomEase.min.js"></script>
    <script src="./vendor/SplitText.min.js"></script>
    <script src="./projects.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
