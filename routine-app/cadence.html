    --md-sys-color-outline:#8f909a;
    --md-sys-color-outline-variant:#45464f;
    --md-sys-color-inverse-surface:#e4e2e6;
    --md-sys-color-inverse-on-surface:#303034;

    --md-sys-color-surface-container-lowest:#0d0e11;
    --md-sys-color-surface-container-low:#1b1b1f;
    --md-sys-color-surface-container:#1f1f23;
    --md-sys-color-surface-container-high:#292a2d;
    --md-sys-color-surface-container-highest:#343438;
  }
}
/* ===================== DARK — explicit toggle ===================== */
:root[data-theme="dark"]{
  --md-sys-color-primary:#b2c5ff;
  --md-sys-color-on-primary:#002b72;
  --md-sys-color-primary-container:#0040a1;
  --md-sys-color-on-primary-container:#dae2ff;
  --md-sys-color-secondary:#c0c6dd;
  --md-sys-color-on-secondary:#2a3042;
  --md-sys-color-secondary-container:#404659;
  --md-sys-color-on-secondary-container:#dce2f9;
  --md-sys-color-tertiary:#e1bbdd;
  --md-sys-color-on-tertiary:#412741;
  --md-sys-color-tertiary-container:#5a3d59;
  --md-sys-color-on-tertiary-container:#fed7f9;
  --md-sys-color-error:#ffb4ab;
  --md-sys-color-on-error:#690005;
  --md-sys-color-error-container:#93000a;
  --md-sys-color-on-error-container:#ffb4ab;
  --md-sys-color-surface:#1b1b1f;
  --md-sys-color-on-surface:#e4e2e6;
  --md-sys-color-surface-variant:#45464f;
  --md-sys-color-on-surface-variant:#c5c6d0;

  --md-sys-color-surface-container-high:#292a2d;
  --md-sys-color-surface-container-highest:#343438;

/* ============================== BASE ============================== */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Noto Sans Arabic",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--md-sys-color-surface-dim);
  color:var(--md-sys-color-on-surface);
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;align-items:center;
  min-height:100svh;padding:24px;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}
input{font-family:inherit;}
svg{display:block;}
:focus-visible{outline:3px solid var(--md-sys-color-primary);outline-offset:2px;}
.divider{height:1px;background:var(--md-sys-color-outline-variant);border:none;}

/* ===================== M3 TYPE SCALE ===================== */
.display-m{font-size:45px;line-height:52px;font-weight:400;}
.display-s{font-size:36px;line-height:44px;font-weight:400;}
.headline-l{font-size:32px;line-height:40px;font-weight:400;}
.headline-m{font-size:28px;line-height:36px;font-weight:400;}
.headline-s{font-size:24px;line-height:32px;font-weight:400;}
.title-l{font-size:22px;line-height:28px;font-weight:400;}
.title-m{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px;}
.title-s{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;}
.body-l{font-size:16px;line-height:24px;font-weight:400;letter-spacing:.5px;}
.body-m{font-size:14px;line-height:20px;font-weight:400;letter-spacing:.25px;}
.body-s{font-size:12px;line-height:16px;font-weight:400;letter-spacing:.4px;}
.label-l{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;}
.label-m{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px;}
.label-s{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.5px;}

/* ===================== RIPPLE (shared) ===================== */
.ripple{position:relative;overflow:hidden;}
.rip{position:absolute;border-radius:50%;transform:scale(0);pointer-events:none;
  background:currentColor;opacity:.16;animation:rip 560ms var(--md-ease-standard) forwards;}
@keyframes rip{to{transform:scale(1);opacity:0;}}

/* state layer helper */
.state{position:relative;overflow:hidden;}
.state::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;
  transition:opacity var(--md-dur-short) var(--md-ease-standard);pointer-events:none;}
.state:hover::before{opacity:.08;}
.state:active::before{opacity:.12;}

/* ==========================================================================
   ADAPTIVE SHELL — compact (bottom bar) / medium (rail) / expanded (drawer)
   ========================================================================== */
.app{
  position:relative;display:grid;overflow:hidden;
  width:100%;max-width:1180px;height:min(920px,calc(100svh - 48px));
  background:var(--md-sys-color-surface);
  border-radius:var(--md-sys-shape-xl);
  box-shadow:var(--md-elev-3);
  grid-template-columns:1fr;
  grid-template-rows:1fr auto;
  grid-template-areas:"main" "navbar";
}
.nav-drawer,.nav-rail,.pane-support{display:none;}

@media (min-width:700px){
  .app{
    grid-template-columns:88px 1fr;
    grid-template-rows:1fr;
    grid-template-areas:"rail main";
  }
  .nav-rail{display:flex;}
}
@media (min-width:1060px){
  .app{
    grid-template-columns:248px 1fr 348px;
    grid-template-areas:"drawer main support";
  }
  .nav-rail{display:none;}
  .nav-drawer{display:flex;}
  .pane-support{display:flex;}
}
@media (max-width:640px){
  body{padding:0;align-items:stretch;}
  .app{max-width:none;height:100svh;border-radius:0;box-shadow:none;}
}

.pane-main{grid-area:main;display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;}
.nav-bar{grid-area:navbar;}
.nav-rail{grid-area:rail;}
.nav-drawer{grid-area:drawer;}
.pane-support{grid-area:support;}

/* ===================== LARGE COLLAPSING TOP APP BAR ===================== */
.top-bar{
  flex:0 0 auto;position:relative;z-index:6;
  background:var(--md-sys-color-surface);
  transition:background var(--md-dur-med) var(--md-ease-standard),
             box-shadow var(--md-dur-med) var(--md-ease-standard);
}
.top-bar.scrolled{background:var(--md-sys-color-surface-container);}
.tb-row{height:64px;display:grid;grid-template-columns:48px 1fr auto;align-items:center;padding:0 4px 0 8px;gap:4px;}
.tb-row .tb-actions{display:flex;align-items:center;gap:2px;}
.tb-title{opacity:0;transform:translateY(6px);
  transition:opacity var(--md-dur-med) var(--md-ease-standard),transform var(--md-dur-med) var(--md-ease-standard);}
.top-bar.scrolled .tb-title{opacity:1;transform:none;}
.tb-headline{
  padding:0 20px 20px;color:var(--md-sys-color-on-surface);
  transform-origin:left center;
  transition:opacity var(--md-dur-med) var(--md-ease-standard),
             max-height var(--md-dur-med) var(--md-ease-emphasized),
             padding var(--md-dur-med) var(--md-ease-emphasized);
  max-height:60px;overflow:hidden;
}
.top-bar.scrolled .tb-headline{opacity:0;max-height:0;padding-bottom:0;}

/* icon button */
.icon-btn{width:48px;height:48px;border-radius:var(--md-sys-shape-full);
  display:grid;place-items:center;color:var(--md-sys-color-on-surface-variant);flex:0 0 auto;}
.icon-btn.hidden{visibility:hidden;pointer-events:none;}
.icon-btn svg{width:24px;height:24px;fill:currentColor;}

/* tooltip (plain) */
.tip{position:relative;}
.tip::after{
  content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;
  transform:translateX(-50%) translateY(-4px);
  background:var(--md-sys-color-inverse-surface);color:var(--md-sys-color-inverse-on-surface);
  font-size:12px;line-height:16px;letter-spacing:.4px;white-space:nowrap;
  padding:4px 8px;border-radius:var(--md-sys-shape-xs);
  opacity:0;pointer-events:none;z-index:40;
  transition:opacity var(--md-dur-short) var(--md-ease-standard),transform var(--md-dur-short) var(--md-ease-standard);
}
.tip:hover::after{opacity:1;transform:translateX(-50%);}

/* ===================== NAVIGATION BAR (compact) ===================== */
.nav-bar{display:none;height:80px;align-items:flex-start;
  background:var(--md-sys-color-surface-container);padding-top:12px;z-index:5;}
@media (max-width:699px){.nav-bar{display:flex;}}
.nav-item{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--md-sys-color-on-surface-variant);
  transition:color var(--md-dur-short) var(--md-ease-standard);}
.nav-item .pill{position:relative;width:64px;height:32px;border-radius:var(--md-sys-shape-full);
  display:grid;place-items:center;overflow:hidden;}
.nav-item .pill::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--md-sys-color-secondary-container);transform:scaleX(.3);opacity:0;
  transition:transform var(--md-dur-med) var(--md-ease-emphasized),opacity var(--md-dur-short) linear;}
.nav-item.active .pill::before{transform:scaleX(1);opacity:1;}
.nav-item svg{width:24px;height:24px;fill:currentColor;position:relative;}
.nav-item.active{color:var(--md-sys-color-on-surface);}
.nav-item.active .pill{color:var(--md-sys-color-on-secondary-container);}

/* badge */
.badge{position:absolute;top:2px;inset-inline-end:12px;min-width:16px;height:16px;padding:0 4px;
  border-radius:var(--md-sys-shape-full);background:var(--md-sys-color-error);
  color:var(--md-sys-color-on-error);font-size:11px;line-height:16px;font-weight:500;
  text-align:center;z-index:2;}

/* ===================== NAVIGATION RAIL (medium) ===================== */
.nav-rail{flex-direction:column;align-items:center;gap:12px;padding:12px 0;
  background:var(--md-sys-color-surface);border-inline-end:1px solid var(--md-sys-color-outline-variant);}
.rail-fab{width:56px;height:56px;border-radius:var(--md-sys-shape-l);
  display:grid;place-items:center;margin-bottom:12px;
  background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);
  box-shadow:var(--md-elev-1);transition:transform var(--md-dur-med) var(--md-ease-emphasized);}
.rail-fab:active{transform:scale(.94);}
.rail-fab svg{width:24px;height:24px;fill:currentColor;}
.rail-item{width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--md-sys-color-on-surface-variant);
  transition:color var(--md-dur-short) var(--md-ease-standard);}
.rail-item .pill{position:relative;width:56px;height:32px;border-radius:var(--md-sys-shape-full);
  display:grid;place-items:center;overflow:hidden;}
.rail-item .pill::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--md-sys-color-secondary-container);transform:scaleX(.3);opacity:0;
  transition:transform var(--md-dur-med) var(--md-ease-emphasized),opacity var(--md-dur-short) linear;}
.rail-item.active .pill::before{transform:scaleX(1);opacity:1;}
.rail-item svg{width:24px;height:24px;fill:currentColor;position:relative;}
.rail-item.active{color:var(--md-sys-color-on-surface);}
.rail-item.active .pill{color:var(--md-sys-color-on-secondary-container);}

/* ===================== NAVIGATION DRAWER (expanded) ===================== */
.nav-drawer{flex-direction:column;gap:4px;padding:16px 12px;
  background:var(--md-sys-color-surface);border-inline-end:1px solid var(--md-sys-color-outline-variant);}
.drawer-brand{display:flex;align-items:center;gap:12px;padding:12px 16px 20px;}
.drawer-brand .mark{width:36px;height:36px;border-radius:var(--md-sys-shape-full);
  background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);
  display:grid;place-items:center;}
.drawer-brand .mark svg{width:20px;height:20px;fill:currentColor;}
.drawer-item{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;
  border-radius:var(--md-sys-shape-full);color:var(--md-sys-color-on-surface-variant);
  transition:background var(--md-dur-short) var(--md-ease-standard),color var(--md-dur-short) var(--md-ease-standard);}
.drawer-item svg{width:24px;height:24px;fill:currentColor;flex:0 0 auto;}
.drawer-item .grow{flex:1 1 auto;text-align:start;}
.drawer-item .count{font-variant-numeric:tabular-nums;opacity:.8;}
.drawer-item.active{background:var(--md-sys-color-secondary-container);
  color:var(--md-sys-color-on-secondary-container);}
.drawer-section{padding:16px 16px 8px;color:var(--md-sys-color-on-surface-variant);}
.drawer-foot{margin-top:auto;padding:8px;}

/* ===================== SCROLL BODY / VIEWS ===================== */
.body-scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 20px 140px;
  scrollbar-width:thin;scrollbar-color:var(--md-sys-color-outline-variant) transparent;}
.view{display:none;}
.view.active{display:block;}
/* shared-axis X transition between destinations */
.view.enter-r{animation:axisInR var(--md-dur-med) var(--md-ease-emphasized);}
.view.enter-l{animation:axisInL var(--md-dur-med) var(--md-ease-emphasized);}
@keyframes axisInR{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:none;}}
@keyframes axisInL{from{opacity:0;transform:translateX(-28px);}to{opacity:1;transform:none;}}

/* staggered list entrance */
@keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.stagger{opacity:0;animation:riseIn 420ms var(--md-ease-emphasized) forwards;}

/* ===================== HERO ===================== */
.hero{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);
  border-radius:var(--md-sys-shape-xl);padding:24px;margin-bottom:8px;
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.ring{position:relative;flex:0 0 auto;width:104px;height:104px;}
.ring svg{overflow:visible;}
.ring path{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;}
.ring .track{stroke:currentColor;opacity:.2;}
.ring .value{stroke:var(--md-sys-color-primary);}
.ring-label{position:absolute;inset:0;display:grid;place-items:center;
  font-size:24px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums;}
.hero-copy{display:flex;flex-direction:column;gap:2px;min-width:0;}
.hero-copy .date{opacity:.85;text-transform:uppercase;}
.streak{display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);
  border-radius:var(--md-sys-shape-s);padding:4px 10px;align-self:flex-start;}
.streak svg{width:16px;height:16px;fill:var(--md-sys-color-primary);}

/* ===================== SECTION HEADER + LINEAR PROGRESS ===================== */
.section-head{display:flex;align-items:center;gap:8px;padding:20px 12px 8px;
  color:var(--md-sys-color-on-surface-variant);}
.section-head svg{width:18px;height:18px;fill:currentColor;}
.section-head .n{margin-inline-start:auto;font-variant-numeric:tabular-nums;opacity:.75;}
.lin-prog{display:block;width:100%;height:14px;overflow:visible;transform:scaleX(-1);}
.lin-prog .lp-track{fill:none;stroke:var(--md-sys-color-surface-container-highest);stroke-width:4;stroke-linecap:round;}
.lin-prog .lp-active{fill:none;stroke:var(--md-sys-color-primary);stroke-width:4;
  stroke-linecap:round;stroke-linejoin:round;}
.lin-prog .lp-stop{fill:var(--md-sys-color-primary);}
.sec-prog{padding:2px 12px 6px;}

/* ===================== LIST ITEM ===================== */
.list{display:flex;flex-direction:column;gap:4px;}
.item{position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  padding:10px 12px;border-radius:var(--md-sys-shape-m);
  background:var(--md-sys-color-surface-container-low);
  transition:background var(--md-dur-short) var(--md-ease-standard);overflow:hidden;}
.item::before{content:"";position:absolute;inset:0;background:var(--md-sys-color-on-surface);
  opacity:0;transition:opacity var(--md-dur-short) var(--md-ease-standard);pointer-events:none;}
.item:hover::before{opacity:.08;}
.item.done{background:var(--md-sys-color-surface-container);}
.item.sel{background:var(--md-sys-color-secondary-container);}
.item-icon{flex:0 0 auto;width:40px;height:40px;border-radius:var(--md-sys-shape-full);
  display:grid;place-items:center;background:var(--md-sys-color-secondary-container);
  color:var(--md-sys-color-on-secondary-container);
  transition:background var(--md-dur-med) var(--md-ease-standard),color var(--md-dur-med) var(--md-ease-standard);}
.item-icon svg{width:22px;height:22px;fill:currentColor;}
.item.done .item-icon{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);}
.item-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
.item-text .h{color:var(--md-sys-color-on-surface);transition:color var(--md-dur-med) var(--md-ease-standard);}
.item-text .s{color:var(--md-sys-color-on-surface-variant);}
.item.done .item-text .h{color:var(--md-sys-color-on-surface-variant);
  text-decoration:line-through;text-decoration-thickness:1.5px;}
.check{flex:0 0 auto;width:18px;height:18px;margin:0 6px;border-radius:2px;
  border:2px solid var(--md-sys-color-on-surface-variant);display:grid;place-items:center;
  transition:background var(--md-dur-short) var(--md-ease-standard),border-color var(--md-dur-short) var(--md-ease-standard);}
.item.done .check{background:var(--md-sys-color-primary);border-color:var(--md-sys-color-primary);}
.check svg{width:16px;height:16px;fill:var(--md-sys-color-on-primary);opacity:0;transform:scale(.4);
  transition:opacity 120ms,transform var(--md-dur-short) var(--md-ease-emphasized);}
.item.done .check svg{opacity:1;transform:scale(1);}

.empty{text-align:center;padding:56px 24px;color:var(--md-sys-color-on-surface-variant);
  display:flex;flex-direction:column;align-items:center;gap:6px;}
.empty svg{width:48px;height:48px;fill:var(--md-sys-color-outline-variant);margin-bottom:4px;}

/* ===================== CARDS ===================== */
.card{background:var(--md-sys-color-surface-container-low);border-radius:var(--md-sys-shape-l);
  padding:20px 16px;margin-top:12px;}
.card.elevated{background:var(--md-sys-color-surface-container-low);box-shadow:var(--md-elev-1);}
.card.outlined{background:transparent;border:1px solid var(--md-sys-color-outline-variant);}
.card h3{color:var(--md-sys-color-on-surface);margin-bottom:16px;}

/* ===================== CAROUSEL (M3 Expressive multi-browse) ===================== */
.carousel{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;
  scroll-snap-type:x mandatory;scrollbar-width:none;}
.carousel::-webkit-scrollbar{display:none;}
.cara{flex:0 0 auto;scroll-snap-align:start;width:76px;height:112px;
  border-radius:var(--md-sys-shape-l);overflow:hidden;position:relative;
  background:var(--md-sys-color-surface-container-high);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:width var(--md-dur-long) var(--md-ease-emphasized),background var(--md-dur-med) var(--md-ease-standard);}
.cara.today{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container);}
.cara .d{color:var(--md-sys-color-on-surface-variant);}
.cara.today .d{color:var(--md-sys-color-on-tertiary-container);}
.cara .mini{width:36px;height:36px;position:relative;}
.cara .mini svg{overflow:visible;}
.cara .mini path{fill:none;stroke-width:4;stroke-linecap:round;}
.cara .mini .t{stroke:var(--md-sys-color-outline-variant);}
.cara .mini .v{stroke:var(--md-sys-color-primary);}
.cara.today .mini .v{stroke:var(--md-sys-color-tertiary);}

/* ===================== TABS (primary) ===================== */
.tabs{display:flex;border-bottom:1px solid var(--md-sys-color-outline-variant);position:relative;}
.tab{flex:1 1 0;height:48px;display:grid;place-items:center;
  color:var(--md-sys-color-on-surface-variant);
  transition:color var(--md-dur-short) var(--md-ease-standard);}
.tab.active{color:var(--md-sys-color-primary);}
.tab-ind{position:absolute;bottom:0;height:3px;border-radius:3px 3px 0 0;
  background:var(--md-sys-color-primary);
  transition:left var(--md-dur-med) var(--md-ease-emphasized),width var(--md-dur-med) var(--md-ease-emphasized);}

/* ===================== SEARCH BAR ===================== */
.searchbar{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;margin:12px 0 4px;
  background:var(--md-sys-color-surface-container-high);border-radius:var(--md-sys-shape-full);}
.searchbar svg{width:24px;height:24px;fill:var(--md-sys-color-on-surface-variant);flex:0 0 auto;}
.searchbar input{flex:1 1 auto;background:none;border:none;outline:none;font-size:16px;
  letter-spacing:.5px;color:var(--md-sys-color-on-surface);}
.searchbar input::placeholder{color:var(--md-sys-color-on-surface-variant);}

/* ===================== SEGMENTED BUTTON ===================== */
.segmented{display:flex;border:1px solid var(--md-sys-color-outline);
  border-radius:var(--md-sys-shape-full);overflow:hidden;}
.seg{flex:1 1 0;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const KEY = "cadence.v2";

const ICONS = ["water","calm","task","walk","mail","book","gym","coffee","moon","star"];
const PERIODS = [
  {id:"morning",   label:"الصباح",     icon:"sun"},
  {id:"afternoon", label:"بعد الظهر", icon:"horizon"},
  {id:"evening",   label:"المساء",     icon:"moon"}
];
const TEMPLATES = [
  {name:"عشر دقائق قراءة", icon:"book",   period:"evening"},
  {name:"مشي صباحي",       icon:"walk",   period:"morning"},
  {name:"خطّط ليوم غد",    icon:"task",   period:"evening"},
  {name:"تمرين قوة",       icon:"gym",    period:"afternoon"}
];

const dayKey = d => { const x = new Date(d); x.setHours(12,0,0,0);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const TODAY = dayKey(new Date());
const back = n => { const d = new Date(); d.setDate(d.getDate() - n); return d; };

function seed(){
  const old = dayKey(back(45));
  const r = [
    {id:"r1", name:"اشرب كوب ماء", icon:"water",  period:"morning",   active:true, created:old, target:7},
    {id:"r2", name:"تمدد لعشر دقائق",icon:"calm",   period:"morning",   active:true, created:old, target:5},
    {id:"r3", name:"حدّد ثلاث أولويات",   icon:"task",   period:"morning",   active:true, created:old, target:5},
    {id:"r4", name:"امشِ بعد الغداء",       icon:"walk",   period:"afternoon", active:true, created:old, target:6},
    {id:"r5", name:"أفرغ البريد الوارد",        icon:"mail",   period:"afternoon", active:true, created:old, target:5},
    {id:"r6", name:"اقرأ عشرين صفحة",      icon:"book",   period:"evening",   active:true, created:old, target:7},
    {id:"r7", name:"أطفئ الأنوار عند الحادية عشرة",   icon:"moon",   period:"evening",   active:true, created:old, target:7}
  ];
  const log = {};
  const ratios = [0.6,0.85,0.6,0.85,0.71,1,1,1];
  for (let i = 8; i >= 1; i--){
    const take = Math.round(r.length * (ratios[8-i] || 0.7));
    log[dayKey(back(i))] = r.slice(0, take).map(x => x.id);
  }
  return { routines:r, log, theme:null };
}

let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch(e){ state = seed(); }
if (!state || !Array.isArray(state.routines) || !state.routines.length) state = seed();
state.log = state.log || {};
state.routines.forEach(r => { if (!r.created) r.created = dayKey(back(45)); if (!r.target) r.target = 7; });
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

const activeRoutines = () => state.routines.filter(r => r.active);
const doneOn = k => state.log[k] || [];
const isDone = id => doneOn(TODAY).indexOf(id) !== -1;
const AN = n => String(n).replace(/[0-9]/g, d => "\u0660\u0661\u0662\u0663\u0664\u0665\u0666\u0667\u0668\u0669"[+d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function svg(icon, size){ return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'"><use href="#i-'+icon+'"/></svg>'; }
function doneCount(id, days){
  let n = 0;
  for (let i = 0; i < days; i++) if (doneOn(dayKey(back(i))).indexOf(id) !== -1) n++;
  return n;
}
/* a day is scored only against the routines that existed that day */
function scheduledOn(k){
  return state.routines.filter(r => r.active && (r.created || k) <= k);
}
function ratioOn(k){
  const act = scheduledOn(k);
  if (!act.length) return 0;
  const done = doneOn(k).filter(id => act.some(r => r.id === id));
  return Math.min(1, done.length / act.length);
}
function streaks(){
  let best = 0, run = 0;
  for (let i = 90; i >= 0; i--){
    const k = dayKey(back(i));
    if (ratioOn(k) >= 1){ run++; best = Math.max(best, run); }
    else if (k !== TODAY) run = 0;
  }
  let cur = 0;
  for (let i = 0; i <= 90; i++){
    const k = dayKey(back(i));
    if (ratioOn(k) >= 1) cur++;
    else if (k === TODAY) continue;
    else break;
  }
  return { current: cur, best: Math.max(best, cur) };
}

/* ------------------------- ripple ------------------------- */
document.addEventListener("pointerdown", e => {
  const host = e.target.closest(".ripple");
  if (!host || REDUCED) return;
  const rect = host.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 2.2;
  const el = document.createElement("span");
  el.className = "rip";
  el.style.width = el.style.height = size + "px";
  el.style.left = (e.clientX - rect.left - size/2) + "px";
  el.style.top  = (e.clientY - rect.top  - size/2) + "px";
  host.appendChild(el);
  setTimeout(() => el.remove(), 600);
});

/* ------------------------- animated counter ------------------------- */
function countTo(el, to, suffix){
  const from = Number(String(el.textContent).replace(/[\u0660-\u0669]/g, c => c.charCodeAt(0)-0x0660).replace(/[^0-9]/g,"")) || 0;
  if (REDUCED || from === to){ el.textContent = AN(to) + (suffix||""); return; }
  const t0 = performance.now(), D = 700;
  (function step(now){
    const p = Math.min(1, (now - t0) / D);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = AN(Math.round(from + (to - from) * e)) + (suffix||"");
    if (p < 1) requestAnimationFrame(step);
  })(performance.now());
}

/* ==========================================================================
   M3 Expressive — loading indicator (morphing polygon) + progress indicators
   ========================================================================== */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const NPTS = 64;

/* Each shape is a polar radius function, sampled evenly and normalised. */
const SHAPES = [
  {k:10, amp:0.10},   // soft burst
  {k:9,  amp:0.17},   // 9-sided cookie
  {k:5,  amp:0.14},   // pentagon
  {ell:[1,0.60]},     // pill
  {k:8,  amp:0.22},   // sunny
  {k:4,  amp:0.20},   // 4-sided cookie
  {ell:[1,0.82]}      // oval
];
function sampleShape(sh){
  const out = new Array(NPTS);
  for (let i = 0; i < NPTS; i++){
    const t = i / NPTS * Math.PI * 2;
    if (sh.ell){
      const a = sh.ell[0], b = sh.ell[1];
      out[i] = 1 / Math.sqrt(Math.pow(Math.cos(t)/a,2) + Math.pow(Math.sin(t)/b,2));
    } else {
      out[i] = 1 + sh.amp * Math.cos(sh.k * t);
    }
  }
  let mx = 0; for (let i=0;i<NPTS;i++) mx = Math.max(mx, out[i]);
  for (let i=0;i<NPTS;i++) out[i] /= mx;
  return out;
}
const SHAPE_R = SHAPES.map(sampleShape);

/* smooth closed path through the sampled points */
function blobPath(r, cx, cy, R, rot){
  const px = new Array(NPTS), py = new Array(NPTS);
  for (let i = 0; i < NPTS; i++){
    const t = i / NPTS * Math.PI * 2 + rot;
    px[i] = cx + Math.cos(t) * r[i] * R;
    py[i] = cy + Math.sin(t) * r[i] * R;
  }
  const mx0 = (px[NPTS-1] + px[0]) / 2, my0 = (py[NPTS-1] + py[0]) / 2;
  let d = "M" + mx0.toFixed(2) + " " + my0.toFixed(2);
  for (let i = 0; i < NPTS; i++){
    const j = (i + 1) % NPTS;
    d += "Q" + px[i].toFixed(2) + " " + py[i].toFixed(2) + " " +
         ((px[i]+px[j])/2).toFixed(2) + " " + ((py[i]+py[j])/2).toFixed(2);
  }
  return d + "Z";
}

function loadingIndicator(el, size, contained){
  const R = contained ? size * 0.32 : size * 0.46;
  el.innerHTML =
    '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' +
    (contained ? '<circle class="li-container" cx="' + size/2 + '" cy="' + size/2 + '" r="' + (size*0.47) + '"/>' : '') +
    '<path class="li-shape"/></svg>';
  const path = el.querySelector(".li-shape");
  let idx = 0, t0 = performance.now(), raf = 0;
  const DUR = 700;
  function frame(now){
    let p = (now - t0) / DUR;
    if (p >= 1){ idx = (idx + 1) % SHAPE_R.length; t0 = now; p = 0; }
    const e = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
    const a = SHAPE_R[idx], b = SHAPE_R[(idx + 1) % SHAPE_R.length];
    const r = new Array(NPTS);
    for (let k = 0; k < NPTS; k++) r[k] = a[k] + (b[k] - a[k]) * e;
    path.setAttribute("d", blobPath(r, size/2, size/2, R, now / 2600 * Math.PI * 2));
    raf = requestAnimationFrame(frame);
  }
  if (REDUCED){
    path.setAttribute("d", blobPath(SHAPE_R[0], size/2, size/2, R, 0));
  } else {
    raf = requestAnimationFrame(frame);
  }
  return { stop(){ if (raf) cancelAnimationFrame(raf); } };
}

/* ---------------- circular progress (track gap + rounded caps) ---------------- */
function arcPath(cx, cy, r, a0, a1){
  const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
  const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
  const large = (a1 - a0) > Math.PI ? 1 : 0;
  return "M" + x0.toFixed(2) + " " + y0.toFixed(2) +
         "A" + r + " " + r + " 0 " + large + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2);
}
/* radial wave around the circle — flat at 0% and 100%, like the linear one */
const RING_WAVES = 8, RING_AMP = 3.4;
function wavyArc(cx, cy, r, a0, a1, amp, phase){
  if (amp <= 0) return arcPath(cx, cy, r, a0, a1);
  const span = a1 - a0;
  const steps = Math.max(10, Math.round(Math.abs(span) / (Math.PI*2) * 260));
  let d = "";
  for (let i = 0; i <= steps; i++){
    const t = a0 + span * (i / steps);
    const rr = r + amp * Math.sin(RING_WAVES * t + phase);
    d += (i ? "L" : "M") + (cx + rr*Math.cos(t)).toFixed(2) + " " + (cy + rr*Math.sin(t)).toFixed(2);
  }
  return d;
}
let ringPct = 0;
function setRing(pct){
  if (typeof pct === "number") ringPct = pct;
  const cx = 52, cy = 52, r = 45, gap = 0.22, start = -Math.PI/2;
  const value = $("#ringValue"), track = $("#ringTrack");
  if (!value || !track) return;
  const p = ringPct, sweep = Math.PI * 2 * p;
  const wavy = p > 0.002 && p < 0.998 && !REDUCED;
  const amp = wavy ? RING_AMP : 0;
  if (p <= 0.002){
    value.setAttribute("d", "");
  } else if (p >= 0.998){
    value.setAttribute("d",
      arcPath(cx,cy,r,start,start+Math.PI) + arcPath(cx,cy,r,start+Math.PI,start+Math.PI*1.999));
  } else {
    value.setAttribute("d", wavyArc(cx,cy,r,start,start+sweep,amp,wavePhase));
  }
  const t0 = start + sweep + gap, t1 = start + Math.PI*2 - gap;
  track.setAttribute("d", (t1 - t0) > 0.06 ? arcPath(cx,cy,r,t0,t1) : "");
}

/* ---------------- wavy linear progress ---------------- */
function drawLinear(svg, phase){
  const pct = Math.max(0, Math.min(1, Number(svg.dataset.pct) || 0));
  const wavy = svg.dataset.wavy === "1";
  const W = Math.max(48, Math.round(svg.clientWidth || svg.parentNode.clientWidth || 240));
  const H = 14, cy = H / 2;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const x0 = 3, xEnd = W - 7, span = xEnd - x0;
  const activeEnd = x0 + span * pct;
  const gap = 7, amp = wavy ? 2.8 : 0, lambda = 24;

  let dA = "";
  if (pct > 0.004){
    for (let x = x0; x <= activeEnd; x += 2){
      const y = cy + amp * Math.sin((x / lambda) * Math.PI * 2 + phase);
      dA += (dA ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    const yE = cy + amp * Math.sin((activeEnd / lambda) * Math.PI * 2 + phase);
    dA += "L" + activeEnd.toFixed(1) + " " + yE.toFixed(1);
  }
  const tStart = Math.min(xEnd, activeEnd + (pct > 0.004 ? gap : 0));
  const dT = tStart < xEnd ? "M" + tStart.toFixed(1) + " " + cy + "L" + xEnd + " " + cy : "";
  svg.innerHTML =
    '<path class="lp-track" d="' + dT + '"/>' +
    '<path class="lp-active" d="' + dA + '"/>' +
    '<circle class="lp-stop" cx="' + (W - 3) + '" cy="' + cy + '" r="2"/>';
}
let wavePhase = 0, waveRaf = 0;
function layoutLinear(){
  document.querySelectorAll(".lin-prog").forEach(sv => drawLinear(sv, wavePhase));
}
function waveLoop(){
  wavePhase -= 0.09;
  document.querySelectorAll('.lin-prog[data-wavy="1"]').forEach(sv => drawLinear(sv, wavePhase));
  setRing();
  waveRaf = requestAnimationFrame(waveLoop);
}
window.addEventListener("resize", layoutLinear);

  return '<svg viewBox="0 0 36 36" width="36" height="36">' +
    '<path class="t" d="' + arcPath(c,c,r,start,start+Math.PI*1.999) + '"/>' +
    '<path class="v" d="' + val + '"/></svg>';
}

let range = 7;
function renderInsights(){
  const st = streaks();
  countTo($("#sCurrent"), st.current);
  countTo($("#sBest"), st.best);
  let sum = 0;
  for (let i = range - 1; i >= 0; i--) sum += ratioOn(dayKey(back(i)));
  countTo($("#sRate"), Math.round(sum / range * 100), "%");
  $("#sRateLabel").textContent = "آخر " + AN(range) + " يوماً";
  let total = 0; Object.keys(state.log).forEach(k => { total += doneOn(k).length; });
  countTo($("#sTotal"), total);
  $("#chartTitle").textContent = range === 7 ? "هذا الأسبوع" : "آخر ٣٠ يوماً";

  const shown = range === 7 ? 7 : 15;
  const step = range === 7 ? 1 : 2;
  let html = "";
  for (let i = (shown - 1) * step; i >= 0; i -= step){
    const d = back(i), k = dayKey(d), r = Math.round(ratioOn(k) * 100);
    html += '<div class="bar-col' + (k === TODAY ? " today" : "") + '">' +
      '<div class="bar-track"><div class="bar-fill" data-h="' + r + '" style="transition-delay:' +
        ((shown - i/step) * 26) + 'ms"></div></div>' +
      '<span class="d label-s">' + (range === 7
          ? d.toLocaleDateString("ar-u-nu-arab",{weekday:"narrow"})
          : AN(d.getDate())) + '</span></div>';
  }
  $("#chart").innerHTML = html;

  const rows = activeRoutines().map(r => ({ r, n: doneCount(r.id, 7) })).sort((a,b) => b.n - a.n);
  $("#consistency").innerHTML = rows.length ? rows.map(x =>
    '<div class="con-row"><span class="ic">' + svg(x.r.icon, 18) + '</span>' +
    '<span class="nm body-m">' + esc(x.r.name) + '</span>' +
    '<span class="con-meter"><i data-w="' + Math.round(x.n / 7 * 100) + '"></i></span>' +
    '<span class="v label-m">' + AN(x.n) + '/٧</span></div>').join("")
    : '<span class="body-m" style="color:var(--md-sys-color-on-surface-variant)">لا يوجد روتين نشط بعد.</span>';

  requestAnimationFrame(() => {
    $$("#chart .bar-fill").forEach(el => { el.style.height = Math.max(Number(el.dataset.h), 2) + "%"; });
    $$("#consistency .con-meter i").forEach(el => { el.style.width = el.dataset.w + "%"; });
  });
}

  state.log[TODAY] = list;
  save(); renderToday(); renderInsights(); renderSupport();
  const act = activeRoutines();
  if (i === -1 && act.length && act.every(r => isDone(r.id))) snack("أنجزت كل الروتين اليوم");
});

let menuFor = null;
function closeMenu(){ $("#menu").classList.remove("open"); menuFor = null; }
$("#manageList").addEventListener("click", e => {
  const det = e.target.closest("[data-detail]");
  if (det){ openDetail(det.dataset.detail); return; }
  const sw = e.target.closest("[data-active]");
  if (sw){
    const r = state.routines.find(x => x.id === sw.dataset.active);
    if (r){ r.active = !r.active; save(); renderAll(); }
    return;
  }
  const mb = e.target.closest("[data-menu]");
  if (mb){
    menuFor = mb.dataset.menu;
    const m = $("#menu"), app = $(".app").getBoundingClientRect(), b = mb.getBoundingClientRect();
    m.style.top  = (b.bottom - app.top + 4) + "px";
    m.style.left = Math.min(app.width - 198, Math.max(8, b.left - app.left)) + "px";
    const r = state.routines.find(x => x.id === menuFor);
    m.querySelector('[data-act="toggle"]').lastChild.textContent = r && r.active ? "إيقاف مؤقت" : "استئناف";
    m.classList.add("open");
    e.stopPropagation();
  }
});
$("#menu").addEventListener("click", e => {
  const it = e.target.closest("[data-act]");
  if (!it || !menuFor) return;
  const id = menuFor, idx = state.routines.findIndex(x => x.id === id);
  const r = state.routines[idx];
  closeMenu();
  if (!r) return;
  if (it.dataset.act === "toggle"){ r.active = !r.active; save(); renderAll(); snack(r.active ? "تم الاستئناف" : "تم الإيقاف"); }
  if (it.dataset.act === "dup"){
    state.routines.splice(idx + 1, 0,
      { id:"r"+Date.now().toString(36), name:r.name+" (نسخة)", icon:r.icon, period:r.period,
        active:true, created:TODAY, target:r.target });
    save(); renderAll(); snack("تم التكرار");
  }
  if (it.dataset.act === "del"){
    state.routines.splice(idx, 1);
    if (selectedId === id) selectedId = null;
    save(); renderAll();
    snack("تم حذف " + r.name, () => { state.routines.splice(idx, 0, r); save(); renderAll(); });
  }
});
document.addEventListener("click", e => { if (!e.target.closest("#menu") && !e.target.closest("[data-menu]")) closeMenu(); });

/* detail actions (sheet or support pane) */
document.addEventListener("click", e => {
  const ps = e.target.closest("[data-period-set]");
  if (ps){
    const r = state.routines.find(x => x.id === selectedId);
    if (r){ r.period = ps.dataset.periodSet; save(); renderAll();
      if ($("#sheet").classList.contains("open")) $("#sheetBody").innerHTML = detailHTML(r); }
    return;
  }
  const dt = e.target.closest("[data-detail-toggle]");
  if (dt){
    const r = state.routines.find(x => x.id === dt.dataset.detailToggle);
    if (r){ r.active = !r.active; save(); renderAll();
      if ($("#sheet").classList.contains("open")) $("#sheetBody").innerHTML = detailHTML(r);
      snack(r.active ? "تم الاستئناف" : "تم الإيقاف"); }
    return;
  }
  const dd = e.target.closest("[data-detail-del]");
  if (dd){
    const id = dd.dataset.detailDel, idx = state.routines.findIndex(x => x.id === id);
    if (idx === -1) return;
    const r = state.routines[idx];
    state.routines.splice(idx, 1);
    selectedId = null; closeSheet(); save(); renderAll();
    snack("تم حذف " + r.name, () => { state.routines.splice(idx, 0, r); save(); renderAll(); });
  }
});

/* ========================= SEARCH / FILTER / TABS ========================= */
$("#searchInput").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderManage(); });
$("#filterSeg").addEventListener("click", e => {
  const s = e.target.closest("[data-filter]"); if (!s) return;
  filterMode = s.dataset.filter;
  $$("#filterSeg .seg").forEach(x => x.classList.toggle("selected", x === s));
  renderManage();
});
function moveTabInd(){
  const active = $("#tabs .tab.active"), tabs = $("#tabs");
  if (!active) return;
  const a = active.getBoundingClientRect(), t = tabs.getBoundingClientRect();
  const ind = $("#tabInd");
  ind.style.width = (a.width * 0.45) + "px";
  ind.style.left = (a.left - t.left + a.width * 0.275) + "px";
}
$("#tabs").addEventListener("click", e => {
  const t = e.target.closest("[data-range]"); if (!t) return;
  range = Number(t.dataset.range);
  $$("#tabs .tab").forEach(x => x.classList.toggle("active", x === t));
  moveTabInd(); renderInsights();
});
window.addEventListener("resize", () => { moveTabInd(); layoutLinear(); renderSupport(); });

/* ========================= FAB MENU ========================= */
let fabOpen = false;
function setFab(open){
  fabOpen = open;
  $("#fabMenu").classList.toggle("open", open);
  $("#fab").classList.toggle("open", open);
}
$("#fab").addEventListener("click", e => { e.stopPropagation(); setFab(!fabOpen); });
$("#railFab").addEventListener("click", () => openDialog());
document.addEventListener("click", e => { if (fabOpen && !e.target.closest(".fab-wrap")) setFab(false); });
$("#fabMenu").addEventListener("click", e => {
  const o = e.target.closest("[data-add]"); if (!o) return;
  setFab(false);
  const kind = o.dataset.add;
  if (kind === "blank") return openDialog();
  if (kind === "water"){
    addRoutine("اشرب كوب ماء", "water", "morning", 7);
    return snack("تمت إضافة روتين سريع");
  }
  const t = TEMPLATES[Math.floor(Math.random() * TEMPLATES.length)];
  addRoutine(t.name, t.icon, t.period, 5);
  snack("تمت إضافة " + t.name);
});
function addRoutine(name, icon, period, target){
  state.routines.push({ id:"r"+Date.now().toString(36), name, icon, period, active:true, created:TODAY, target });
  save(); renderAll();
}

/* ========================= DIALOG ========================= */
let draft = { period:"morning", icon:"water", target:7 };
function buildDialog(){
  $("#periodSeg").innerHTML = PERIODS.map(p =>
    '<button class="seg ripple' + (draft.period === p.id ? " selected" : "") + '" data-period="' + p.id + '">' +
    '<span class="tick">' + svg("check",18) + '</span><span>' + p.label + '</span></button>').join("");
  $("#iconChips").innerHTML = ICONS.map(ic =>
    '<button class="chip chip-icon ripple state' + (draft.icon === ic ? " selected" : "") +
    '" data-icon="' + ic + '" aria-label="' + ic + '">' + svg(ic, 22) + '</button>').join("");
  setTarget(draft.target);
}
function setTarget(v){
  draft.target = Math.max(1, Math.min(7, v));
  const pctv = (draft.target - 1) / 6;
  $("#targetVal").textContent = AN(draft.target);
  $("#targetFill").style.width = (pctv * 100) + "%";
  $("#targetHandle").style.insetInlineStart = (pctv * 100) + "%";
}
$("#periodSeg").addEventListener("click", e => {
  const c = e.target.closest("[data-period]"); if (!c) return;
  draft.period = c.dataset.period;
  $$("#periodSeg .seg").forEach(x => x.classList.toggle("selected", x === c));
});
$("#iconChips").addEventListener("click", e => {
  const c = e.target.closest("[data-icon]"); if (!c) return;
  draft.icon = c.dataset.icon;
  $$("#iconChips .chip").forEach(x => x.classList.toggle("selected", x === c));
});
/* slider drag */
(function(){
  const track = $("#targetSlider");
  let dragging = false;
  const apply = clientX => {
    const b = track.getBoundingClientRect();
    const ratio = 1 - (clientX - b.left) / b.width;   // RTL
    setTarget(Math.round(ratio * 6) + 1);
  };
  track.addEventListener("pointerdown", e => { dragging = true; track.setPointerCapture(e.pointerId); apply(e.clientX); });
  track.addEventListener("pointermove", e => { if (dragging) apply(e.clientX); });
  track.addEventListener("pointerup",   () => { dragging = false; });
  track.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft")  setTarget(draft.target - 1);
    if (e.key === "ArrowRight") setTarget(draft.target + 1);
  });
})();
function openDialog(){
  draft = { period:"morning", icon:"water", target:7 };
  $("#nameInput").value = "";
  $("#tfWrap").classList.remove("filled");
  $("#saveBtn").disabled = true;
  buildDialog();
  $("#scrim").classList.add("open");
  $("#dialog").classList.add("open");
  setTimeout(() => $("#nameInput").focus(), 140);
}
function closeDialog(){ $("#scrim").classList.remove("open"); $("#dialog").classList.remove("open"); }
$("#cancelBtn").addEventListener("click", closeDialog);
$("#scrim").addEventListener("click", () => { closeDialog(); closeSheet(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#dialog").classList.contains("open")) closeDialog();
  if ($("#sheet").classList.contains("open")) closeSheet();
  if (fabOpen) setFab(false);
  closeMenu();
});
$("#nameInput").addEventListener("input", e => {
  $("#saveBtn").disabled = !e.target.value.trim();
  $("#tfWrap").classList.toggle("filled", !!e.target.value);
});
$("#saveBtn").addEventListener("click", () => {
  const name = $("#nameInput").value.trim();
  if (!name) return;
  addRoutine(name, draft.icon, draft.period, draft.target);
  closeDialog();
  snack("تمت إضافة " + name);
});

/* ========================= SORT / REFRESH / THEME ========================= */
let sortAlpha = false;
$("#tuneBtn").addEventListener("click", () => {
  sortAlpha = !sortAlpha;
  state.routines.sort(sortAlpha
    ? (a,b) => a.name.localeCompare(b.name)
    : (a,b) => ORDER_P.indexOf(a.period) - ORDER_P.indexOf(b.period));
  save(); renderManage();
  snack(sortAlpha ? "مرتّب أبجدياً" : "مرتّب حسب الوقت");
});
const ORDER_P = ["morning","afternoon","evening"];

let refreshing = false;
$("#refreshBtn").addEventListener("click", () => {
  if (refreshing) return;
  refreshing = true;
  $("#chart").innerHTML = '<div class="inline-load"><div class="loading-indicator" id="chartLoader"></div>' +
                          '<span class="cap body-m">جارٍ إعادة الحساب</span></div>';
  const li = loadingIndicator($("#chartLoader"), 48, false);
  setTimeout(() => { li.stop(); renderInsights(); refreshing = false; }, REDUCED ? 120 : 900);
});

function systemDark(){ return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function applyTheme(){
  const root = document.documentElement;
  if (state.theme) root.setAttribute("data-theme", state.theme); else root.removeAttribute("data-theme");
  const dark = state.theme ? state.theme === "dark" : systemDark();
  $("#themeIcon").setAttribute("href", dark ? "#i-sun" : "#i-moon");
  $("#themeBtn").setAttribute("data-tip", dark ? "المظهر الفاتح" : "المظهر الداكن");
}
function toggleTheme(){
  const dark = state.theme ? state.theme === "dark" : systemDark();
  state.theme = dark ? "light" : "dark";
  save(); applyTheme();
}
$("#themeBtn").addEventListener("click", toggleTheme);
const dth = $("#drawerTheme"); if (dth) dth.addEventListener("click", toggleTheme);

/* ========================= BOOT ========================= */
applyTheme();
renderAll();
moveTabInd();
$("#tuneBtn").classList.add("hidden");

const bootLI = loadingIndicator($("#bootIndicator"), 60, true);
setTimeout(() => {
  $("#bootLoader").classList.add("gone");
  setTimeout(() => bootLI.stop(), 700);
}, REDUCED ? 250 : 1500);

if (!REDUCED) waveLoop();
})();
</script>
