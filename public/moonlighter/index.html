<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Moonkeeper" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Moonkeeper</title>
<style>
  /* Pixel fonts bundled locally (SIL Open Font License, see fonts/) */
  @font-face { font-family: "Pixelify Sans"; font-weight: 400; src: url(fonts/pixelify-sans-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Pixelify Sans"; font-weight: 700; src: url(fonts/pixelify-sans-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Silkscreen"; font-weight: 400; src: url(fonts/silkscreen-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Silkscreen"; font-weight: 700; src: url(fonts/silkscreen-latin-700-normal.woff2) format("woff2"); }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: "Pixelify Sans", monospace;
  }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; overflow: hidden; }
  #wrap { position: fixed; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  canvas#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.touch #touch { display: block; }
  .tbtn {
    position: absolute; pointer-events: auto; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font: 700 12px "Silkscreen", monospace; color: #f3eedb; background: #2c3350;
    border: 3px solid #d8a458; box-shadow: 0 3px 0 rgba(0,0,0,.45);
  }
  .tbtn.pill { border-radius: 10px; }
  /* "moon glass" skins: dark glass discs, a thin gold rim, a coloured moon-arc along the bottom,
     crisp pixel icons and small captions. Colours come from --acc / --acc2 (set at boot). */
  .tbtn.gl { border: none; border-radius: 50%; color: #f3eedb; overflow: visible;
    --acc: #8a96c8; --acc2: #222840;
    background:
      radial-gradient(circle at 50% 30%, rgba(255,255,255,.10), rgba(255,255,255,0) 45%),
      radial-gradient(circle at 50% 55%, rgba(34,30,50,.80), rgba(10,9,18,.86) 72%);
    box-shadow: 0 0 0 1.5px rgba(232,190,110,.92), 0 0 0 3px rgba(20,14,12,.55), inset 0 0 0 2px rgba(10,9,18,.55),
      inset 0 -7px 10px -5px var(--acc), 0 5px 12px rgba(0,0,0,.45);
    transition: transform .09s ease-out, opacity .18s, box-shadow .12s, background .12s; opacity: .94; }
  .tbtn.gl::before { content: ""; position: absolute; inset: 7%; border-radius: 50%;
    border: 1px solid rgba(244,212,154,.16); pointer-events: none; }
  .tbtn.gl .ic { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
    background: var(--ic) center 44% / var(--ics, 46%) auto no-repeat; image-rendering: pixelated;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.55)); }
  .tbtn.gl.cap .ic { background-position: center 36%; }
  .tbtn.gl .lb { position: absolute; left: -10%; right: -10%; bottom: 13%; text-align: center; pointer-events: none;
    font: 400 var(--lbs, 9px) "Silkscreen", monospace; letter-spacing: .06em; color: #f3eedb; opacity: .9;
    text-shadow: 0 1px 0 #000, 0 0 4px rgba(0,0,0,.8); }
  .tbtn.gl .lb::after { content: attr(data-l); }
  .tbtn.gl.on { transform: scale(.9); opacity: 1;
    background: radial-gradient(circle at 50% 35%, var(--acc), var(--acc2) 78%);
    box-shadow: 0 0 0 2px #f4d49a, 0 0 0 3.5px rgba(20,14,12,.6), 0 0 18px var(--acc), 0 2px 6px rgba(0,0,0,.4); }
  .tbtn.gl.sq { border-radius: 32%; opacity: .82; }
  .tbtn.gl.sq.on { opacity: 1; }
  .tbtn.gl[data-n]::after { content: attr(data-n); position: absolute; right: -4px; bottom: -4px; min-width: 18px; height: 18px; padding: 0 4px;
    box-sizing: border-box; border-radius: 9px; background: #f3eedb; color: #2a1a14; font: 700 11px/18px "Pixelify Sans", monospace;
    text-align: center; box-shadow: 0 0 0 1.5px #2a1a14, 0 2px 3px rgba(0,0,0,.5); pointer-events: none; }
  .tbtn.gl[data-n="0"]::after { background: #6a6470; color: #d8d0c0; }
  .tbtn.gl.sq::before { border-radius: 28%; }
  .tbtn.gl.pill { border-radius: 999px; }
  .tbtn.gl.pill::before { border-radius: 999px; }
  .tbtn.gl.pill .ic { background-position: 16% 50%; }
  .tbtn.gl.pill .lb { bottom: auto; top: 50%; transform: translateY(-50%); left: 30%; right: 0; text-align: left; }
  .tbtn.act.idle { opacity: .55; }
  .tbtn.gl[data-b="A"].ready { opacity: 1; animation: ready 1.2s ease-in-out infinite; }
  .tbtn.gl[data-b="A"].ready.on { animation: none; }
  @keyframes ready { 50% { transform: scale(1.06); box-shadow: 0 0 0 2px #f4d49a, 0 0 0 3.5px rgba(20,14,12,.6), inset 0 -7px 10px -5px var(--acc), 0 0 20px var(--acc); } }
  /* menus: A confirms, B goes back */
  body.ui .tbtn.gl[data-b="A"], body.ui .tbtn.gl[data-b="B"] { animation: none; }
  body.ui .tbtn.gl[data-b="A"] { --acc: #5cc06a; --acc2: #1d3b23; }
  body.ui .tbtn.gl[data-b="B"] { --acc: #d8844e; --acc2: #3a1e18; }
  body.ui .tbtn.gl[data-b="A"] .ic, body.ui .tbtn.gl[data-b="B"] .ic { background-image: var(--ic-ui); }
  body.ui .tbtn.gl[data-b="A"] .lb::after, body.ui .tbtn.gl[data-b="B"] .lb::after { content: attr(data-lu); }
  body.ui #touch .tbtn[data-b="X"], body.ui #touch .tbtn[data-b="Y"],
  body.peace #touch .tbtn[data-b="X"], body.peace #touch .tbtn[data-b="Y"] { display: none; }
  #stick { position: absolute; pointer-events: auto; border-radius: 50%;
    background: radial-gradient(circle, rgba(10,9,18,.10) 40%, rgba(10,9,18,.42) 72%);
    box-shadow: 0 0 0 1.5px rgba(232,190,110,.55), inset 0 0 0 1px rgba(244,212,154,.12); }
  #stick::before { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: var(--ticks) center / 100% 100% no-repeat; opacity: .7; }
  #knob { position: absolute; width: 42%; height: 42%; left: 29%; top: 29%; border-radius: 50%;
    background: radial-gradient(circle at 50% 32%, rgba(255,255,255,.22), rgba(255,255,255,0) 50%),
      radial-gradient(circle at 50% 55%, rgba(46,42,66,.92), rgba(14,12,24,.95) 75%);
    box-shadow: 0 0 0 1.5px rgba(232,190,110,.95), 0 0 0 3px rgba(20,14,12,.5), 0 4px 10px rgba(0,0,0,.5); }
  #knob::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: radial-gradient(circle, #f4d49a, #c8904a 70%); opacity: .85;
    box-shadow: 0 0 6px rgba(244,212,154,.6); }
  #stickZone { position: absolute; pointer-events: auto; }
  #stick { transition: opacity .2s; opacity: .7; }
  #stick.active { opacity: 1; transition: none; }
  #aHint { position: absolute; text-align: right; pointer-events: none; }
  #aHint span { display: inline-block; padding: 4px 9px 5px; background: #efe3c5; color: #4a3b28; font: 700 12px "Pixelify Sans", monospace;
    border: 2px solid #2a1a14; border-radius: 7px; box-shadow: 0 2px 0 rgba(0,0,0,.5); white-space: nowrap; }
  #aHint:empty { display: none; }
  body.touch #aHint { display: none; } /* the in-world prompt (tappable) already names the action */
  #skipBtn { display: none; }
  body.cine #touch .tbtn, body.cine #stick, body.cine #stickZone, body.cine #aHint { display: none; }
  body.cine #touch #skipBtn { display: flex; }
  body.cine #touch #fsBtn { display: flex; }
  body.ui #stickZone { pointer-events: none; }
  body.ui #stick { display: none; }
  body.ui #touch .tbtn.small:not(#fsBtn) { display: none; } /* menus are tapped directly */
  body.ui #aHint { display: none; }
  body.fs #fsBtn, body.nofs #fsBtn { display: none !important; }
  * { -webkit-touch-callout: none; }
  #rotate { position: fixed; left: 0; right: 0; top: 8px; text-align: center; color: #efe3c5;
    font: 12px "Silkscreen", monospace; display: none; pointer-events: none; opacity: .7; }
  body.touch.portrait #rotate { display: block; }
</style>
</head>
<body>
<div id="stage">
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div id="stickZone"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="aHint"></div>
  <div class="tbtn pill" id="skipBtn" data-b="SKIP" aria-label="Skip">SKIP</div>
  <div class="tbtn act" data-b="X" aria-label="Attack">ATK</div>
  <div class="tbtn act" data-b="B" aria-label="Dash roll">DASH</div>
  <div class="tbtn act" data-b="Y" aria-label="Guard / special">GRD</div>
  <div class="tbtn act" data-b="A" aria-label="Use / talk">USE</div>
  <div class="tbtn small" data-b="SELECT" aria-label="Bag">BAG</div>
  <div class="tbtn small" data-b="RB" aria-label="Potion">POT</div>
  <div class="tbtn small" data-b="LB" aria-label="Swap weapon">SWAP</div>
  <div class="tbtn small" data-b="START" aria-label="Pause">II</div>
  <div class="tbtn small" data-b="PENDANT" aria-label="Pendant">HOME</div>
  <div class="tbtn small" id="fsBtn" data-b="FS" aria-label="Fullscreen">FULL</div>
</div>
<div id="rotate">rotate for a bigger view</div>
</div>

<script src="js/engine.js"></script>
<script src="js/voice.js"></script>
<script src="js/art.js"></script>
<script src="js/pixelui.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/hud.js"></script>
<script src="js/postfx.js"></script>
<script src="js/entities.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/town.js"></script>
<script src="js/shop.js"></script>
<script src="js/menus.js"></script>
<script src="js/craft.js"></script>
<script src="js/minigame.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/story.js"></script>
<script src="js/main.js"></script>
</body>
</html>
