/* ============================== BASE ============================== */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--md-sys-color-surface-dim);
  color:var(--md-sys-color-on-surface);
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;align-items:center;
  min-height:100svh;padding:24px 16px;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}
input{font-family:inherit;}
svg{display:block;}
:focus-visible{outline:3px solid var(--md-sys-color-primary);outline-offset:2px;}

/* ===================== M3 TYPE SCALE ===================== */
.display-s{font-size:36px;line-height:44px;font-weight:400;letter-spacing:0;}
.headline-m{font-size:28px;line-height:36px;font-weight:400;}
.headline-s{font-size:24px;line-height:32px;font-weight:400;}
.title-l{font-size:22px;line-height:28px;font-weight:400;}
.title-m{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px;}
.title-s{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;}
.body-l{font-size:16px;line-height:24px;font-weight:400;letter-spacing:.5px;}
.body-m{font-size:14px;line-height:20px;font-weight:400;letter-spacing:.25px;}
.body-s{font-size:12px;line-height:16px;font-weight:400;letter-spacing:.4px;}
.label-l{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;}
.label-m{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px;}
.label-s{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.5px;}

/* ===================== APP SHELL (device frame on desktop) ===================== */
.app{
  position:relative;width:100%;max-width:412px;height:min(892px,calc(100svh - 48px));
  background:var(--md-sys-color-surface);
  border-radius:var(--md-sys-shape-xl);
  box-shadow:var(--md-elev-3);
  display:flex;flex-direction:column;overflow:hidden;
}
@media (max-width:600px){
  body{padding:0;align-items:stretch;}
  .app{max-width:none;height:100svh;border-radius:0;box-shadow:none;}
}

/* ===================== TOP APP BAR (center-aligned) ===================== */
.top-bar{
  flex:0 0 auto;height:64px;display:grid;
  grid-template-columns:48px 1fr 48px;align-items:center;
  padding:0 4px;background:var(--md-sys-color-surface);
  position:relative;z-index:3;
  transition:background var(--md-dur-med) var(--md-ease-standard);
}
.top-bar.scrolled{background:var(--md-sys-color-surface-container);}
.top-bar h1{text-align:center;color:var(--md-sys-color-on-surface);}

/* Icon button + state layer */
.icon-btn{
  width:48px;height:48px;border-radius:var(--md-sys-shape-full);
  display:grid;place-items:center;position:relative;
  color:var(--md-sys-color-on-surface-variant);
}
.icon-btn::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:currentColor;opacity:0;
  transition:opacity var(--md-dur-short) var(--md-ease-standard);
}
.icon-btn:hover::before{opacity:.08;}
.icon-btn:active::before{opacity:.12;}
.icon-btn.hidden{visibility:hidden;pointer-events:none;}

/* ===================== SCROLL BODY ===================== */
.body-scroll{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding:0 16px 168px;scrollbar-width:thin;
  scrollbar-color:var(--md-sys-color-outline-variant) transparent;
}
.view{display:none;}
.view.active{display:block;animation:view-in var(--md-dur-med) var(--md-ease-decel);}
@keyframes view-in{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

/* ===================== TODAY HERO — progress ===================== */
.hero{
  background:var(--md-sys-color-primary-container);
  color:var(--md-sys-color-on-primary-container);
  border-radius:var(--md-sys-shape-xl);
  padding:24px;margin-bottom:8px;
  display:flex;align-items:center;gap:20px;
}

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const KEY = "cadence.v1";

const ICONS = [
  {id:"water", label:"Water"},   {id:"calm",  label:"Stretch"},
  {id:"task",  label:"Plan"},    {id:"walk",  label:"Walk"},
  {id:"mail",  label:"Inbox"},   {id:"book",  label:"Read"},
  {id:"gym",   label:"Train"},   {id:"coffee",label:"Coffee"},
  {id:"moon",  label:"Sleep"}
];
const PERIODS = [
  {id:"morning",   label:"Morning",   icon:"i-sun"},
  {id:"afternoon", label:"Afternoon", icon:"i-horizon"},
  {id:"evening",   label:"Evening",   icon:"i-moon"}
];

/* ------------------------------ state ------------------------------ */
const dayKey = d => { const x = new Date(d); x.setHours(12,0,0,0);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const TODAY = dayKey(new Date());

function seed(){
  const oldD = new Date(); oldD.setDate(oldD.getDate() - 45);
  const old = dayKey(oldD);
  const r = [
    {id:"r1", name:"Drink a glass of water", icon:"water",  period:"morning",   active:true, created:old},
    {id:"r2", name:"Stretch for ten minutes",icon:"calm",   period:"morning",   active:true, created:old},
    {id:"r3", name:"Set three priorities",   icon:"task",   period:"morning",   active:true, created:old},
    {id:"r4", name:"Walk after lunch",       icon:"walk",   period:"afternoon", active:true, created:old},
    {id:"r5", name:"Clear the inbox",        icon:"mail",   period:"afternoon", active:true, created:old},
    {id:"r6", name:"Read twenty pages",      icon:"book",   period:"evening",   active:true, created:old},
    {id:"r7", name:"Lights out by eleven",   icon:"moon",   period:"evening",   active:true, created:old}
  ];
  // plausible history for the past six days
  const log = {};
  const ratios = [0.57, 0.85, 0.71, 1, 1, 1];
  for (let i = 6; i >= 1; i--){
    const d = new Date(); d.setDate(d.getDate() - i);
    const take = Math.round(r.length * ratios[6 - i]);
    log[dayKey(d)] = r.slice(0, take).map(x => x.id);
  }
  return { routines:r, log, theme:null };
}

let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || seed(); }
catch(e){ state = seed(); }
if (!state || !Array.isArray(state.routines)) state = seed();
state.log = state.log || {};
(function migrate(){
  const d = new Date(); d.setDate(d.getDate() - 45);
  const back = dayKey(d);
  state.routines.forEach(r => { if (!r.created) r.created = back; });
})();

function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

/* ------------------------------ helpers ------------------------------ */
const activeRoutines = () => state.routines.filter(r => r.active);
const doneOn = k => state.log[k] || [];
const isDone = id => doneOn(TODAY).indexOf(id) !== -1;
function scheduledOn(k){
  return state.routines.filter(r => r.active && (r.created || k) <= k);
}
function ratioOn(k){
  const act = scheduledOn(k);
  if (!act.length) return 0;
  const done = doneOn(k).filter(id => act.some(r => r.id === id));
  return Math.min(1, done.length / act.length);
}
function recentText(id){
  let n = 0;
  for (let i = 1; i <= 7; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    if (doneOn(dayKey(d)).indexOf(id) !== -1) n++;
  }
  if (n === 7) return "Every day this week";
  if (n === 0) return "Not yet this week";
  return n + " of the last 7 days";
}
function svg(icon, size){
  return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'"><use href="#i-'+icon+'"/></svg>';
}
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function streaks(){
  let current = 0, best = 0, run = 0;
  for (let i = 60; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    const full = ratioOn(k) >= 1;
    if (full){ run++; best = Math.max(best, run); }
    else if (k !== TODAY) run = 0;
  }
  // current streak counts back from today (today may still be in progress)
  run = 0;
  for (let i = 0; i <= 60; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    if (ratioOn(k) >= 1) run++;
    else if (k === TODAY) continue;
    else break;
  }
  current = run;
  return { current, best: Math.max(best, current) };
}


/* ==========================================================================
   M3 Expressive — loading indicator (morphing polygon) + progress indicators
   ========================================================================== */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const NPTS = 64;

/* Each shape is a polar radius function, sampled evenly and normalised. */
const SHAPES = [
  {k:10, amp:0.10},   // soft burst
  {k:9,  amp:0.17},   // 9-sided cookie
  {k:5,  amp:0.14},   // pentagon
  {ell:[1,0.60]},     // pill
  {k:8,  amp:0.22},   // sunny
  {k:4,  amp:0.20},   // 4-sided cookie
  {ell:[1,0.82]}      // oval
];
function sampleShape(sh){
  const out = new Array(NPTS);
  for (let i = 0; i < NPTS; i++){
    const t = i / NPTS * Math.PI * 2;
    if (sh.ell){
      const a = sh.ell[0], b = sh.ell[1];
      out[i] = 1 / Math.sqrt(Math.pow(Math.cos(t)/a,2) + Math.pow(Math.sin(t)/b,2));
    } else {
      out[i] = 1 + sh.amp * Math.cos(sh.k * t);
    }
  }
  let mx = 0; for (let i=0;i<NPTS;i++) mx = Math.max(mx, out[i]);
  for (let i=0;i<NPTS;i++) out[i] /= mx;
  return out;
}
const SHAPE_R = SHAPES.map(sampleShape);

/* smooth closed path through the sampled points */
function blobPath(r, cx, cy, R, rot){
  const px = new Array(NPTS), py = new Array(NPTS);
  for (let i = 0; i < NPTS; i++){
    const t = i / NPTS * Math.PI * 2 + rot;
    px[i] = cx + Math.cos(t) * r[i] * R;
    py[i] = cy + Math.sin(t) * r[i] * R;
  }
  const mx0 = (px[NPTS-1] + px[0]) / 2, my0 = (py[NPTS-1] + py[0]) / 2;
  let d = "M" + mx0.toFixed(2) + " " + my0.toFixed(2);
  for (let i = 0; i < NPTS; i++){
    const j = (i + 1) % NPTS;
    d += "Q" + px[i].toFixed(2) + " " + py[i].toFixed(2) + " " +
         ((px[i]+px[j])/2).toFixed(2) + " " + ((py[i]+py[j])/2).toFixed(2);
  }
  return d + "Z";
}

function loadingIndicator(el, size, contained){
  const R = contained ? size * 0.32 : size * 0.46;
  el.innerHTML =
    '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' +
    (contained ? '<circle class="li-container" cx="' + size/2 + '" cy="' + size/2 + '" r="' + (size*0.47) + '"/>' : '') +
    '<path class="li-shape"/></svg>';
  const path = el.querySelector(".li-shape");
  let idx = 0, t0 = performance.now(), raf = 0;
  const DUR = 700;
  function frame(now){
    let p = (now - t0) / DUR;
    if (p >= 1){ idx = (idx + 1) % SHAPE_R.length; t0 = now; p = 0; }
    const e = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
    const a = SHAPE_R[idx], b = SHAPE_R[(idx + 1) % SHAPE_R.length];
    const r = new Array(NPTS);
    for (let k = 0; k < NPTS; k++) r[k] = a[k] + (b[k] - a[k]) * e;
    path.setAttribute("d", blobPath(r, size/2, size/2, R, now / 2600 * Math.PI * 2));
    raf = requestAnimationFrame(frame);
  }
  if (REDUCED){
    path.setAttribute("d", blobPath(SHAPE_R[0], size/2, size/2, R, 0));
  } else {
    raf = requestAnimationFrame(frame);
  }
  return { stop(){ if (raf) cancelAnimationFrame(raf); } };
}

/* ---------------- circular progress (track gap + rounded caps) ---------------- */
function arcPath(cx, cy, r, a0, a1){
  const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
  const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
  const large = (a1 - a0) > Math.PI ? 1 : 0;
  return "M" + x0.toFixed(2) + " " + y0.toFixed(2) +
         "A" + r + " " + r + " 0 " + large + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2);
}
function setRing(pct){
  const cx = 48, cy = 48, r = 41, gap = 0.20, start = -Math.PI/2;
  const value = $("#ringValue"), track = $("#ringTrack");
  if (!value || !track) return;
  const sweep = Math.PI * 2 * pct;
  if (pct <= 0.002){
    value.setAttribute("d", "");
  } else if (pct >= 0.998){
    value.setAttribute("d",
      arcPath(cx,cy,r,start,start+Math.PI) + arcPath(cx,cy,r,start+Math.PI,start+Math.PI*1.999));
  } else {
    value.setAttribute("d", arcPath(cx,cy,r,start,start+sweep));
  }
  const t0 = start + sweep + gap, t1 = start + Math.PI*2 - gap;
  track.setAttribute("d", (t1 - t0) > 0.06 ? arcPath(cx,cy,r,t0,t1) : "");
}

/* ---------------- wavy linear progress ---------------- */
function drawLinear(svg, phase){
  const pct = Math.max(0, Math.min(1, Number(svg.dataset.pct) || 0));
  const wavy = svg.dataset.wavy === "1";
  const W = Math.max(48, Math.round(svg.clientWidth || svg.parentNode.clientWidth || 240));
  const H = 14, cy = H / 2;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const x0 = 3, xEnd = W - 7, span = xEnd - x0;
  const activeEnd = x0 + span * pct;
  const gap = 7, amp = wavy ? 2.8 : 0, lambda = 24;

  let dA = "";
  if (pct > 0.004){
    for (let x = x0; x <= activeEnd; x += 2){
      const y = cy + amp * Math.sin((x / lambda) * Math.PI * 2 + phase);
      dA += (dA ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    const yE = cy + amp * Math.sin((activeEnd / lambda) * Math.PI * 2 + phase);
    dA += "L" + activeEnd.toFixed(1) + " " + yE.toFixed(1);
  }
  const tStart = Math.min(xEnd, activeEnd + (pct > 0.004 ? gap : 0));
  const dT = tStart < xEnd ? "M" + tStart.toFixed(1) + " " + cy + "L" + xEnd + " " + cy : "";
  svg.innerHTML =
    '<path class="lp-track" d="' + dT + '"/>' +
    '<path class="lp-active" d="' + dA + '"/>' +
    '<circle class="lp-stop" cx="' + (W - 3) + '" cy="' + cy + '" r="2"/>';
}
let wavePhase = 0, waveRaf = 0;
function layoutLinear(){
  document.querySelectorAll(".lin-prog").forEach(sv => drawLinear(sv, wavePhase));
}
function waveLoop(){
  wavePhase -= 0.09;
  document.querySelectorAll('.lin-prog[data-wavy="1"]').forEach(sv => drawLinear(sv, wavePhase));
  waveRaf = requestAnimationFrame(waveLoop);
}
window.addEventListener("resize", layoutLinear);

/* ------------------------------ render: today ------------------------------ */
function renderToday(){
  const act = activeRoutines();
  const done = act.filter(r => isDone(r.id)).length;
  const pct = act.length ? Math.round(done / act.length * 100) : 0;

  setRing(act.length ? done / act.length : 0);
  $("#ringLabel").textContent = pct + "%";

  $("#heroDate").textContent = new Date().toLocaleDateString(undefined,
    {weekday:"long", month:"long", day:"numeric"});
  $("#heroCount").textContent = act.length
    ? (done === act.length ? "All done — nice work" : done + " of " + act.length + " done")
    : "No routines yet";
  const st = streaks();
  $("#streakText").textContent = st.current === 1 ? "1 day streak" : st.current + " day streak";

  let html = "";
  PERIODS.forEach(p => {
    const items = act.filter(r => r.period === p.id);
    if (!items.length) return;
    const nDone = items.filter(r => isDone(r.id)).length;
    html += '<div class="section-head">' + svg(p.icon.slice(2), 18) +
            '<span class="title-s">' + p.label + '</span>' +
            '<span class="n label-m">' + nDone + '/' + items.length + '</span></div>';
    const ratio = nDone / items.length;
    html += '<div class="sec-prog"><svg class="lin-prog" data-pct="' + ratio +
            '" data-wavy="' + (ratio > 0 && ratio < 1 ? 1 : 0) + '"></svg></div>';
    html += '<div class="list">';
    items.forEach(r => {
      const d = isDone(r.id);
      html += '<button class="item' + (d ? " done" : "") + '" data-toggle="' + r.id + '"' +
              ' aria-pressed="' + d + '">' +
                '<span class="item-icon">' + svg(r.icon, 22) + '</span>' +
                '<span class="item-text"><span class="h body-l">' + esc(r.name) + '</span>' +
                '<span class="s body-s">' + recentText(r.id) + '</span></span>' +
                '<span class="check">' + svg("check", 16) + '</span>' +
              '</button>';
    });
    html += '</div>';
  });
  if (!act.length){
    html = '<div class="empty">' + svg("task", 48) +
           '<span class="title-m">Nothing scheduled</span>' +
           '<span class="body-m">Add your first routine to get going.</span></div>';
  }
  $("#todayList").innerHTML = html;
  requestAnimationFrame(layoutLinear);
}

/* ------------------------------ render: manage ------------------------------ */
function renderManage(){
  if (!state.routines.length){
    $("#manageList").innerHTML = '<div class="empty">' + svg("list", 48) +
      '<span class="title-m">No routines</span>' +
      '<span class="body-m">Tap New to create one.</span></div>';
    return;
  }
  let html = '<div class="section-head" style="padding-top:16px">' +
    '<span class="title-s">All routines</span>' +
    '<span class="n label-m">' + state.routines.length + '</span></div><div class="list">';
  state.routines.forEach(r => {
    const p = PERIODS.find(x => x.id === r.period) || PERIODS[0];
    html += '<div class="manage-item' + (r.active ? "" : " off") + '">' +
      '<span class="item-icon">' + svg(r.icon, 22) + '</span>' +
      '<span class="grow"><span class="body-l">' + esc(r.name) + '</span>' +
      '<span class="body-s" style="color:var(--md-sys-color-on-surface-variant)">' + p.label + '</span></span>' +
      '<button class="switch' + (r.active ? " on" : "") + '" data-active="' + r.id +
        '" role="switch" aria-checked="' + r.active + '" aria-label="Enable ' + esc(r.name) + '"></button>' +
      '<button class="del" data-del="' + r.id + '" aria-label="Delete ' + esc(r.name) + '">' + svg("trash", 20) + '</button>' +
    '</div>';
  });
  $("#manageList").innerHTML = html + '</div>';
}

/* ------------------------------ render: insights ------------------------------ */
function renderInsights(){
  const st = streaks();
  $("#sCurrent").textContent = st.current;
  $("#sBest").textContent = st.best;

  let sum = 0, total = 0;
  for (let i = 6; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i);
    sum += ratioOn(dayKey(d));
  }
  $("#sRate").textContent = Math.round(sum / 7 * 100) + "%";
  Object.keys(state.log).forEach(k => { total += doneOn(k).length; });
  $("#sTotal").textContent = total;

  let html = "";
  for (let i = 6; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    const r = Math.round(ratioOn(k) * 100);
    const isToday = k === TODAY;
    html += '<div class="bar-col' + (isToday ? " today" : "") + '">' +
      '<div class="bar-track"><div class="bar-fill" data-h="' + r + '"></div></div>' +
      '<span class="d label-s">' + d.toLocaleDateString(undefined,{weekday:"narrow"}) + '</span></div>';
  }
  $("#chart").innerHTML = html;

  const rows = activeRoutines().map(r => {
    let n = 0;
    for (let i = 0; i < 7; i++){
      const d = new Date(); d.setDate(d.getDate() - i);
      if (doneOn(dayKey(d)).indexOf(r.id) !== -1) n++;
    }
    return { r, n };
  }).sort((a, b) => b.n - a.n);

  $("#consistency").innerHTML = rows.length
    ? rows.map(x =>
        '<div class="con-row"><span class="ic">' + svg(x.r.icon, 18) + '</span>' +
        '<span class="nm body-m">' + esc(x.r.name) + '</span>' +
        '<span class="con-meter"><i data-w="' + Math.round(x.n / 7 * 100) + '"></i></span>' +
        '<span class="v label-m">' + x.n + '/7</span></div>').join("")
    : '<span class="body-m" style="color:var(--md-sys-color-on-surface-variant)">No active routines yet.</span>';

  requestAnimationFrame(() => {
    $("#chart").querySelectorAll(".bar-fill").forEach(el => {
      el.style.height = Math.max(Number(el.dataset.h), 2) + "%";
    });
    $("#consistency").querySelectorAll(".con-meter i").forEach(el => {
      el.style.width = el.dataset.w + "%";
    });
  });
}

function renderAll(){ renderToday(); renderManage(); renderInsights(); }

/* ------------------------------ snackbar ------------------------------ */
let snackTimer = null, undoFn = null;
function snack(msg, onUndo){
  $("#snackMsg").textContent = msg;
  undoFn = onUndo || null;
  $("#snackAction").style.display = undoFn ? "" : "none";
  $("#snackbar").classList.add("show");
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => $("#snackbar").classList.remove("show"), 4000);
}
$("#snackAction").addEventListener("click", () => {
  if (undoFn) undoFn();
  $("#snackbar").classList.remove("show");
});

/* ------------------------------ interactions ------------------------------ */
$("#todayList").addEventListener("click", e => {
  const btn = e.target.closest("[data-toggle]");
  if (!btn) return;
  const id = btn.dataset.toggle;
  const list = state.log[TODAY] ? state.log[TODAY].slice() : [];
  const i = list.indexOf(id);
  if (i === -1) list.push(id); else list.splice(i, 1);
  state.log[TODAY] = list;
  save(); renderAll();
  const act = activeRoutines();
  if (i === -1 && act.length && act.every(r => isDone(r.id))) snack("Every routine done today");
});

$("#manageList").addEventListener("click", e => {
  const sw = e.target.closest("[data-active]");
  if (sw){
    const r = state.routines.find(x => x.id === sw.dataset.active);
    if (r){ r.active = !r.active; save(); renderAll(); }
    return;
  }
  const del = e.target.closest("[data-del]");
  if (del){
    const id = del.dataset.del;
    const idx = state.routines.findIndex(x => x.id === id);
    if (idx === -1) return;
    const removed = state.routines[idx];
    state.routines.splice(idx, 1);
    save(); renderAll();
    snack("Deleted " + removed.name, () => {
      state.routines.splice(idx, 0, removed); save(); renderAll();
    });
  }
});

/* ------------------------------ navigation ------------------------------ */
const TITLES = {today:"Today", routines:"Routines", insights:"Insights"};
document.querySelectorAll(".nav-item").forEach(btn => {
  btn.addEventListener("click", () => {
    const v = btn.dataset.view;
    document.querySelectorAll(".nav-item").forEach(b => {
      const on = b === btn;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", String(on));
    });
    document.querySelectorAll(".view").forEach(s =>
      s.classList.toggle("active", s.id === "view-" + v));
    $("#barTitle").textContent = TITLES[v];
    $("#fab").classList.toggle("hidden", v === "insights");
    $("#refreshBtn").classList.toggle("hidden", v !== "insights");
    $("#scroller").scrollTop = 0;
    if (v === "insights") renderInsights();
  });
});

$("#scroller").addEventListener("scroll", () => {
  $("#topBar").classList.toggle("scrolled", $("#scroller").scrollTop > 4);
});

/* ------------------------------ dialog ------------------------------ */
let draft = { period:"morning", icon:"water" };

function buildChips(){
  $("#periodChips").innerHTML = PERIODS.map(p =>
    '<button class="chip' + (draft.period === p.id ? " selected" : "") + '" data-period="' + p.id + '">' +
    svg(p.icon.slice(2), 18) + '<span>' + p.label + '</span></button>').join("");
  $("#iconChips").innerHTML = ICONS.map(ic =>
    '<button class="chip chip-icon' + (draft.icon === ic.id ? " selected" : "") + '" data-icon="' + ic.id +
    '" aria-label="' + ic.label + '" title="' + ic.label + '">' + svg(ic.id, 22) + '</button>').join("");
}
$("#periodChips").addEventListener("click", e => {
  const c = e.target.closest("[data-period]"); if (!c) return;
  draft.period = c.dataset.period; buildChips();
});
$("#iconChips").addEventListener("click", e => {
  const c = e.target.closest("[data-icon]"); if (!c) return;
  draft.icon = c.dataset.icon; buildChips();
});

function openDialog(){
  draft = { period:"morning", icon:"water" };
  $("#nameInput").value = "";
  $("#tfWrap").classList.remove("filled");
  $("#saveBtn").disabled = true;
  buildChips();
  $("#scrim").classList.add("open");
  $("#dialog").classList.add("open");
  setTimeout(() => $("#nameInput").focus(), 120);
}
function closeDialog(){
  $("#scrim").classList.remove("open");
  $("#dialog").classList.remove("open");
}
$("#fab").addEventListener("click", openDialog);
$("#cancelBtn").addEventListener("click", closeDialog);
$("#scrim").addEventListener("click", closeDialog);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#dialog").classList.contains("open")) closeDialog();
});
$("#nameInput").addEventListener("input", e => {
  const v = e.target.value.trim();
  $("#saveBtn").disabled = !v;
  $("#tfWrap").classList.toggle("filled", !!e.target.value);
});
$("#saveBtn").addEventListener("click", () => {
  const name = $("#nameInput").value.trim();
  if (!name) return;
  state.routines.push({
    id: "r" + Date.now().toString(36),
    name, icon: draft.icon, period: draft.period, active: true, created: TODAY
  });
  save(); renderAll(); closeDialog();
  snack("Added " + name);
});

let refreshing = false;
$("#refreshBtn").addEventListener("click", () => {
  if (refreshing) return;
  refreshing = true;
  const chart = $("#chart");
  chart.innerHTML = '<div class="inline-load"><div class="loading-indicator" id="chartLoader"></div>' +
                    '<span class="cap body-m">Recalculating</span></div>';
  const li = loadingIndicator($("#chartLoader"), 48, false);
  setTimeout(() => {
    li.stop();
    renderInsights();
    refreshing = false;
  }, REDUCED ? 120 : 900);
});

/* ------------------------------ theme ------------------------------ */
function systemDark(){ return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function applyTheme(){
  const root = document.documentElement;
  if (state.theme) root.setAttribute("data-theme", state.theme);
  else root.removeAttribute("data-theme");
  const dark = state.theme ? state.theme === "dark" : systemDark();
  $("#themeIcon").setAttribute("href", dark ? "#i-sun" : "#i-moon");
  $("#themeBtn").setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
}
$("#themeBtn").addEventListener("click", () => {
  const dark = state.theme ? state.theme === "dark" : systemDark();
  state.theme = dark ? "light" : "dark";
  save(); applyTheme();
});

/* ------------------------------ boot ------------------------------ */
applyTheme();
renderAll();

const bootLI = loadingIndicator($("#bootIndicator"), 56, true);
setTimeout(() => {
  $("#bootLoader").classList.add("gone");
  setTimeout(() => bootLI.stop(), 700);
}, REDUCED ? 250 : 1600);

if (!REDUCED) waveLoop();
})();
</script>
